[package]
name = "phonon"
version = "0.1.0"
authors = ["Jiekang Tian"]
edition = "2024"
description = "Computational environment for molecular & material research."
readme = "README.md"
repository = "https://github.com/nmrtist/phonon"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
eframe = "0.34"
egui-phosphor = "0.12.0"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
nalgebra = "0.35.0"
rfd = "0.17"
# Pinned to 0.39: rusqlite 0.40 pulls libsqlite3-sys 0.38, whose build script uses
# the still-unstable `cfg_select!` macro and fails to compile on stable Rust.
rusqlite = { version = "0.39", features = ["bundled"] }
sdfrust = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.3.0"
uuid = { version = "1", features = ["v4"] }
